[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sticker-cutout-tuner"
version = "0.1.0"
description = "Local tools for converting white-background meme stickers into transparent PNG stickers"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
keywords = ["stickers", "image-processing", "opencv", "flask", "png"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Intended Audience :: Developers",
  "Intended Audience :: End Users/Desktop",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Multimedia :: Graphics :: Graphics Conversion",
  "Topic :: Software Development :: User Interfaces",
]
dependencies = [
  "flask>=3.1,<4",
  "numpy>=2,<3",
  "opencv-python-headless>=4.13,<5",
  "pillow>=11.3,<12",
  "scipy>=1.13,<2",
]

[project.optional-dependencies]
release = [
  "build>=1.2,<2",
  "python-semantic-release>=9,<10",
]

[project.scripts]
sticker-cutout = "process_stickers:main"
sticker-cutout-web = "web_app:main"


[tool.setuptools]
py-modules = ["process_stickers", "web_app"]

[tool.semantic_release]
allow_zero_version = true
branch = "main"
changelog_file = "CHANGELOG.md"
commit_author = "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
commit_message = "chore(release): {version} [skip ci]"
commit_parser = "conventional"
dist_path = "dist/"
major_on_zero = false
tag_format = "v{version}"
upload_to_pypi = false
upload_to_vcs_release = true
version_toml = ["pyproject.toml:project.version"]
build_command = """
python -m pip install build
python -m build
"""

[tool.semantic_release.commit_parser_options]
allowed_tags = ["build", "chore", "ci", "docs", "feat", "fix", "perf", "refactor", "style", "test"]
minor_tags = ["feat"]
patch_tags = ["fix", "perf", "refactor"]

